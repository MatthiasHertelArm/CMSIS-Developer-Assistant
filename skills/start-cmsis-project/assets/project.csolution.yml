# Template of the first CMSIS solution: one bare-metal project.
# Every __TOKEN__ is replaced before the file is written; see the skill.
solution:
  created-for: CMSIS-Toolbox@2.12.0
  cdefault:
  compiler: __COMPILER__

  packs:
    - pack: ARM::CMSIS
    # Remove this entry when the DFP and the BSP are the same pack.
    - pack: __DEVICE_SUPPORT_PACK__
    # Remove this entry when the board has no BSP.
    - pack: __BOARD_SUPPORT_PACK__

  target-types:
    - type: __TARGET_TYPE__
      # Remove board: when the board has no BSP.
      board: __CMSIS_BOARD__
      device: __CMSIS_DEVICE__
      target-set:
        - set:
          images:
            - project-context: __PROJECT_NAME__.Debug
          # Remove debugger: when no debug adapter was chosen.
          debugger:
            name: __DEBUG_ADAPTER__

  build-types:
    - type: Debug
      debug: on
      optimize: none
    - type: Release
      debug: off
      optimize: balanced

  projects:
    - project: ./__PROJECT_NAME__/__PROJECT_NAME__.cproject.yml
